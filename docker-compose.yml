version: '3.8'
services:
  mysql:
    container_name: sbot_mysql
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME:-auto_sbot}
      - MYSQL_USER=${DB_USER:-adminsbot}
      - MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network

  appseed-app:
    container_name: sbot_app
    restart: always
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - TRUST_X_FORWARDED_PROTO=True
    volumes:
      - ./:/app
    networks:
      - db_network
      - web_network
    depends_on:
      - mysql

  nginx:
    container_name: sbot_nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./staticfiles:/staticfiles
      - ./media:/media
    networks:
      - web_network
    depends_on:
      - appseed-app

networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  mysql_data:

# Stack demo: copie .env.example → .env, defina DB_PASSWORD y MYSQL_ROOT_PASSWORD.
# Acceso: http://localhost:5085 (nginx → gunicorn). Para TLS público: termine SSL en nginx
# y use DJANGO_USE_HTTPS=True + CSRF_TRUSTED_ORIGINS=https://... en .env (SCRUM-13).

