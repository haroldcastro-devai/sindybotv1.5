version: '3.8'
services:
  mysql:
    container_name: sbot_mysql
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME:-auto_sbot}
      - MYSQL_USER=${DB_USER:-adminsbot}
      - MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_network

  appseed-app:
    container_name: sbot_app
    restart: always
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - ./:/app
    networks:
      - db_network
      - web_network
    depends_on:
      - mysql

  nginx:
    container_name: sbot_nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./static:/static
      - ./media:/media
    networks:
      - web_network
    depends_on:
      - appseed-app

networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge

volumes:
  mysql_data:

# ---
