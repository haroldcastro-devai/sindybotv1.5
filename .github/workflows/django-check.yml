name: Django check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  django-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System deps (mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: manage.py check and check --deploy
        run: bash scripts/verify-django-deploy-check.sh
      - name: Verify STT provider wiring (SCRUM-36)
        run: python scripts/verify_stt_provider_wiring.py

