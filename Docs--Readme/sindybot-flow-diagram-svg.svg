<svg viewBox="0 0 1000 1600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de marcadores de flecha -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
    <marker id="errorArrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CC0000" />
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0066CC">Diagrama de Flujo: Sistema de Auditoría Automatizada SINDYBOT</text>
  <text x="500" y="70" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Proceso de auditoría desde carga de Excel hasta generación de reportes</text>
  
  <!-- FASE 1: ENTRADA -->
  <rect x="100" y="100" width="800" height="150" rx="10" ry="10" fill="#e6f3ff" stroke="#0066CC" stroke-width="2"/>
  <text x="500" y="125" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0066CC">FASE DE ENTRADA</text>
  
  <rect x="150" y="150" width="300" height="70" rx="8" ry="8" fill="#d6eaff" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Carga de Archivo Excel</text>
  <text x="300" y="200" font-family="Arial" font-size="12" text-anchor="middle">(remote_auditor.py)</text>
  
  <rect x="550" y="150" width="300" height="70" rx="8" ry="8" fill="#d6eaff" stroke="#333333" stroke-width="1.5"/>
  <text x="700" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Extracción de datos</text>
  <text x="700" y="200" font-family="Arial" font-size="12" text-anchor="middle">(contratos, fechas, productos)</text>
  
  <line x1="450" y1="185" x2="550" y2="185" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 2: DESCUBRIMIENTO -->
  <rect x="100" y="280" width="800" height="150" rx="10" ry="10" fill="#e6f7e6" stroke="#009933" stroke-width="2"/>
  <text x="500" y="305" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#009933">FASE DE DESCUBRIMIENTO DE ARCHIVOS</text>
  
  <rect x="150" y="330" width="300" height="70" rx="8" ry="8" fill="#d6f5d6" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Búsqueda de Archivos de Audio</text>
  <text x="300" y="380" font-family="Arial" font-size="12" text-anchor="middle">(remote_auditor.py)</text>
  
  <rect x="550" y="330" width="300" height="70" rx="8" ry="8" fill="#d6f5d6" stroke="#333333" stroke-width="1.5"/>
  <text x="700" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Filtrado por Contrato y Fecha</text>
  <text x="700" y="380" font-family="Arial" font-size="12" text-anchor="middle">Agrupación de archivos divididos</text>
  
  <line x1="450" y1="365" x2="550" y2="365" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Conector entre fase 1 y 2 -->
  <line x1="700" y1="220" x2="700" y2="280" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 3: PROCESAMIENTO DE AUDIO -->
  <rect x="100" y="460" width="800" height="300" rx="10" ry="10" fill="#fff2e6" stroke="#CC6600" stroke-width="2"/>
  <text x="500" y="485" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#CC6600">FASE DE PROCESAMIENTO DE AUDIO</text>
  
  <!-- Rombo de decisión para tipo de llamada -->
  <polygon points="500,445 530,475 500,505 470,475" fill="#ffffcc" stroke="#CC6600" stroke-width="1.5"/>
  <text x="500" y="480" font-family="Arial" font-size="12" text-anchor="middle">¿Tipo?</text>
  
  <!-- Llamada normal -->
  <rect x="150" y="520" width="300" height="220" rx="8" ry="8" fill="#fce5cc" stroke="#CC6600" stroke-width="1.5"/>
  <text x="300" y="545" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">LLAMADA NORMAL</text>
  
  <rect x="175" y="560" width="250" height="50" rx="5" ry="5" fill="#ffffff" stroke="#CC6600" stroke-width="1"/>
  <text x="300" y="590" font-family="Arial" font-size="12" text-anchor="middle">Transcripción con WhisperX</text>
  <text x="300" y="605" font-family="Arial" font-size="10" text-anchor="middle">(audio_processing.py)</text>
  
  <rect x="175" y="620" width="250" height="50" rx="5" ry="5" fill="#ffffff" stroke="#CC6600" stroke-width="1"/>
  <text x="300" y="650" font-family="Arial" font-size="12" text-anchor="middle">Diarización de Hablantes</text>
  
  <rect x="175" y="680" width="250" height="40" rx="5" ry="5" fill="#ffffff" stroke="#CC6600" stroke-width="1"/>
  <text x="300" y="705" font-family="Arial" font-size="12" text-anchor="middle">Almacenamiento en log_audio_to_text</text>
  
  <!-- Llamada dividida -->
  <rect x="550" y="520" width="300" height="220" rx="8" ry="8" fill="#ffdcdc" stroke="#CC0000" stroke-width="1.5"/>
  <text x="700" y="545" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">LLAMADA DIVIDIDA</text>
  
  <rect x="575" y="560" width="250" height="50" rx="5" ry="5" fill="#ffffff" stroke="#CC0000" stroke-width="1"/>
  <text x="700" y="590" font-family="Arial" font-size="12" text-anchor="middle">Procesamiento por partes</text>
  <text x="700" y="605" font-family="Arial" font-size="10" text-anchor="middle">(unified_processing.py)</text>
  
  <rect x="575" y="620" width="250" height="50" rx="5" ry="5" fill="#ffffff" stroke="#CC0000" stroke-width="1"/>
  <text x="700" y="650" font-family="Arial" font-size="12" text-anchor="middle">Unificación de Transcripciones</text>
  <text x="700" y="665" font-family="Arial" font-size="10" text-anchor="middle">(text_processing.py)</text>
  
  <rect x="575" y="680" width="250" height="40" rx="5" ry="5" fill="#ffffff" stroke="#CC0000" stroke-width="1"/>
  <text x="700" y="705" font-family="Arial" font-size="12" text-anchor="middle">Almacenamiento en uni_files_audito</text>
  
  <!-- Conectores de decisión a flujos -->
  <line x1="470" y1="475" x2="300" y2="520" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="490" font-family="Arial" font-size="12" text-anchor="middle">1 archivo</text>
  
  <line x1="530" y1="475" x2="700" y2="520" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="635" y="490" font-family="Arial" font-size="12" text-anchor="middle">Múltiples archivos</text>
  
  <!-- Conector entre fase 2 y rombo de decisión -->
  <line x1="700" y1="400" x2="500" y2="445" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 4: EVALUACIÓN -->
  <rect x="100" y="790" width="800" height="220" rx="10" ry="10" fill="#e6e6fa" stroke="#6600CC" stroke-width="2"/>
  <text x="500" y="815" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#6600CC">FASE DE EVALUACIÓN</text>
  
  <rect x="150" y="830" width="700" height="60" rx="8" ry="8" fill="#d9d9f3" stroke="#6600CC" stroke-width="1.5"/>
  <text x="500" y="860" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Carga de Datos de Referencia</text>
  <text x="500" y="880" font-family="Arial" font-size="12" text-anchor="middle">guionV2.json y tarifasV2.json</text>
  
  <rect x="150" y="900" width="340" height="60" rx="8" ry="8" fill="#d9d9f3" stroke="#6600CC" stroke-width="1.5"/>
  <text x="320" y="930" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Evaluación de Llamada</text>
  <text x="320" y="950" font-family="Arial" font-size="12" text-anchor="middle">(call_evaluation.py)</text>
  
  <rect x="510" y="900" width="340" height="60" rx="8" ry="8" fill="#d9d9f3" stroke="#6600CC" stroke-width="1.5"/>
  <text x="680" y="930" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Detección de Elementos</text>
  <text x="680" y="950" font-family="Arial" font-size="12" text-anchor="middle">(detection.py)</text>
  
  <!-- Elementos de verificación -->
  <rect x="150" y="970" width="165" height="30" rx="5" ry="5" fill="#e6d9ff" stroke="#6600CC" stroke-width="1"/>
  <text x="233" y="990" font-family="Arial" font-size="12" text-anchor="middle">Aceptaciones</text>
  
  <rect x="325" y="970" width="165" height="30" rx="5" ry="5" fill="#e6d9ff" stroke="#6600CC" stroke-width="1"/>
  <text x="408" y="990" font-family="Arial" font-size="12" text-anchor="middle">Adherencia al Guion</text>
  
  <rect x="500" y="970" width="165" height="30" rx="5" ry="5" fill="#e6d9ff" stroke="#6600CC" stroke-width="1"/>
  <text x="583" y="990" font-family="Arial" font-size="12" text-anchor="middle">Validación de Tarifas</text>
  
  <rect x="675" y="970" width="175" height="30" rx="5" ry="5" fill="#e6d9ff" stroke="#6600CC" stroke-width="1"/>
  <text x="763" y="990" font-family="Arial" font-size="12" text-anchor="middle">Manejo de Objeciones</text>
  
  <!-- Conectores -->
  <line x1="320" y1="720" x2="320" y2="790" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="720" x2="680" y2="790" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="500" y1="890" x2="320" y2="900" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="890" x2="680" y2="900" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 5: INTEGRACIÓN CON IA -->
  <rect x="100" y="1040" width="800" height="180" rx="10" ry="10" fill="#f9f9e0" stroke="#666600" stroke-width="2"/>
  <text x="500" y="1065" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#666600">FASE DE INTEGRACIÓN CON IA</text>
  
  <rect x="150" y="1080" width="700" height="50" rx="8" ry="8" fill="#f5f5d6" stroke="#666600" stroke-width="1.5"/>
  <text x="500" y="1110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Generación de Prompt para IA (incluye transcripción, guiones y tarifas)</text>
  
  <rect x="150" y="1140" width="340" height="60" rx="8" ry="8" fill="#f5f5d6" stroke="#666600" stroke-width="1.5"/>
  <text x="320" y="1170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Proceso Ollama (Qwen 14B)</text>
  <text x="320" y="1190" font-family="Arial" font-size="12" text-anchor="middle">Análisis detallado mediante LLM</text>
  
  <rect x="510" y="1140" width="340" height="60" rx="8" ry="8" fill="#f5f5d6" stroke="#666600" stroke-width="1.5"/>
  <text x="680" y="1170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Extracción de Resultados</text>
  <text x="680" y="1190" font-family="Arial" font-size="12" text-anchor="middle">Calificación POSITIVA/NEGATIVA</text>
  
  <!-- Conectores -->
  <line x1="500" y1="1010" x2="500" y2="1040" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="1130" x2="320" y2="1140" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="1130" x2="680" y2="1140" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="1200" x2="510" y2="1170" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 6: BASE DE DATOS -->
  <rect x="100" y="1250" width="800" height="160" rx="10" ry="10" fill="#ffe6e6" stroke="#CC0033" stroke-width="2"/>
  <text x="500" y="1275" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#CC0033">FASE DE ACTUALIZACIÓN DE BASE DE DATOS</text>
  
  <rect x="150" y="1290" width="340" height="100" rx="8" ry="8" fill="#ffd9d9" stroke="#CC0033" stroke-width="1.5"/>
  <text x="320" y="1320" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Actualización de Estado de Venta</text>
  <text x="320" y="1340" font-family="Arial" font-size="12" text-anchor="middle">(data_updateBD.py)</text>
  <text x="320" y="1360" font-family="Arial" font-size="12" text-anchor="middle">• Actualización en MySQL</text>
  <text x="320" y="1380" font-family="Arial" font-size="12" text-anchor="middle">• Guardado en Log_sales_audito</text>
  
  <rect x="510" y="1290" width="340" height="100" rx="8" ry="8" fill="#ffd9d9" stroke="#CC0033" stroke-width="1.5"/>
  <text x="680" y="1320" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Almacenamiento de Datos</text>
  <text x="680" y="1340" font-family="Arial" font-size="12" text-anchor="middle">• Resultados de auditoría</text>
  <text x="680" y="1360" font-family="Arial" font-size="12" text-anchor="middle">• Datos para aprendizaje</text>
  <text x="680" y="1380" font-family="Arial" font-size="12" text-anchor="middle">• Interfaz de usuario actualizada</text>
  
  <!-- Conectores -->
  <line x1="680" y1="1200" x2="680" y2="1250" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="1340" x2="510" y2="1340" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FASE 7: SALIDA -->
  <rect x="100" y="1440" width="800" height="100" rx="10" ry="10" fill="#e6ffff" stroke="#006666" stroke-width="2"/>
  <text x="500" y="1465" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#006666">FASE DE SALIDA</text>
  
  <rect x="150" y="1480" width="340" height="50" rx="8" ry="8" fill="#d9ffff" stroke="#006666" stroke-width="1.5"/>
  <text x="320" y="1510" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Reporte de Auditoría Generado</text>
  
  <rect x="510" y="1480" width="340" height="50" rx="8" ry="8" fill="#d9ffff" stroke="#006666" stroke-width="1.5"/>
  <text x="680" y="1510" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Dashboard Actualizado</text>
  
  <!-- Conectores -->
  <line x1="680" y1="1390" x2="680" y2="1440" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="1390" x2="320" y2="1480" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- NOTAS DE COMPONENTES CLAVE -->
  <rect x="50" y="1560" width="900" height="30" rx="5" ry="5" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="500" y="1580" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">ARCHIVOS CLAVE DEL SISTEMA</text>
  
  <!-- Nota 1: Archivos Principales -->
  <rect x="60" y="1600" width="280" height="140" rx="5" ry="5" fill="#ffffcc" stroke="#999999" stroke-width="1"/>
  <text x="200" y="1620" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Archivos Principales</text>
  <text x="200" y="1640" font-family="Arial" font-size="11" text-anchor="middle">• remote_auditor.py</text>
  <text x="200" y="1660" font-family="Arial" font-size="11" text-anchor="middle">• audio_processing.py</text>
  <text x="200" y="1680" font-family="Arial" font-size="11" text-anchor="middle">• unified_processing.py</text>
  <text x="200" y="1700" font-family="Arial" font-size="11" text-anchor="middle">• call_evaluation.py</text>
  <text x="200" y="1720" font-family="Arial" font-size="11" text-anchor="middle">• detection.py</text>
  
  <!-- Nota 2: Archivos de Datos -->
  <rect x="360" y="1600" width="280" height="90" rx="5" ry="5" fill="#ffffcc" stroke="#999999" stroke-width="1"/>
  <text x="500" y="1620" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Archivos de Datos</text>
  <text x="500" y="1640" font-family="Arial" font-size="11" text-anchor="middle">• guionV2.json</text>
  <text x="500" y="1660" font-family="Arial" font-size="11" text-anchor="middle">• tarifasV2.json</text>
  <text x="500" y="1680" font-family="Arial" font-size="11" text-anchor="middle">• bd.sqlite3</text>
  
  <!-- Nota 3: Directorios -->
  <rect x="660" y="1600" width="280" height="110" rx="5" ry="5" fill="#ffffcc" stroke="#999999" stroke-width="1"/>
  <text x="800" y="1620" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Directorios de Salida</text>
  <text x="800" y="1640" font-family="Arial" font-size="11" text-anchor="middle">• log_audio_to_text/</text>
  <text x="800" y="1660" font-family="Arial" font-size="11" text-anchor="middle">• Log_sales_audito/</text>
  <text x="800" y="1680" font-family="Arial" font-size="11" text-anchor="middle">• uni_files_audito/</text>
  <text x="800" y="1700" font-family="Arial" font-size="11" text-anchor="middle">• auditoria.log</text>
  
  <!-- Manejo de Errores -->
  <rect x="850" y="500" width="100" height="120" rx="5" ry="5" fill="#ffb3b3" stroke="#CC0000" stroke-width="1.5"/>
  <text x="900" y="520" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#CC0000">ERRORES</text>
  <text x="900" y="540" font-family="Arial" font-size="10" text-anchor="middle">logger_config.py</text>
  <text x="900" y="565" font-family="Arial" font-size="10" text-anchor="middle">Registro</text>
  <text x="900" y="585" font-family="Arial" font-size="10" text-anchor="middle">Reintento</text>
  <text x="900" y="605" font-family="Arial" font-size="10" text-anchor="middle">3 intentos</text>
  
  <!-- Conexiones de error -->
  <line x1="750" y1="590" x2="850" y2="560" stroke="#CC0000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#errorArrow)"/>
  <line x1="490" y1="1170" x2="850" y2="570" stroke="#CC0000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#errorArrow)"/>
</svg>