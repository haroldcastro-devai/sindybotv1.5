{% extends 'layouts/auth_base.html' %}
{% load static %}
{% block content %}
<div class="auth-wrapper">
	<div class="auth-content">
		<div class="card">
			<div class="row align-items-center text-center">
				<div class="col-md-12">
					<div class="card-body">
						<div class="text-center mb-4">
							<img src="{% static 'assets/images/logo-dark.png' %}" alt="SINDYBOT" class="img-fluid mb-3" style="max-height: 60px;">
							<h4 class="mb-3">Mi perfil</h4>
							<p class="text-muted mb-0">Usuario: <strong>{{ user.username }}</strong></p>
							{% if user.email %}
							<p class="text-muted">Correo: {{ user.email }}</p>
							{% endif %}
						</div>
						<div class="d-grid gap-2">
							<a href="{% url 'change_password' %}" class="btn btn-primary">Cambiar contraseña</a>
							<a href="{% url 'index' %}" class="btn btn-outline-secondary">Volver al dashboard</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock content %}
